<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ── 변수 ─────────────────────────────────────────────────────────────── */
:root {
  --bg:        #0d0f14;
  --bg-card:   #13161e;
  --bg-input:  #0f1117;
  --bg-hover:  #1a1d27;
  --border:    #1e2130;
  --border-hi: #2a2d3e;
  --text:      #e2e8f0;
  --muted:     #64748b;
  --muted2:    #4a5568;
  --green:     #4ade80;
  --red:       #f87171;
  --yellow:    #fbbf24;
  --blue:      #60a5fa;
  --purple:    #a78bfa;
  --green-log: #4ade80;
  --radius:    10px;
  --radius-sm: 6px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', 'Apple SD Gothic Neo', sans-serif;
  font-size: 14px;
  min-height: 100vh;
  line-height: 1.5;
}

/* ── 스크롤바 ─────────────────────────────────────────────────────────── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-hi); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--muted2); }

button { cursor: pointer; font-family: inherit; }
select, textarea, input {
  font-family: 'JetBrains Mono', 'Courier New', monospace;
  color: var(--text);
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  outline: none;
  transition: border-color .2s, box-shadow .2s;
}
select:focus, textarea:focus, input:focus {
  border-color: var(--green);
  box-shadow: 0 0 0 3px rgba(74,222,128,.08);
}

/* ── 헤더 ─────────────────────────────────────────────────────────────── */
header {
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  padding: 0 28px;
  height: 56px;
  display: flex;
  align-items: center;
  gap: 14px;
  position: sticky;
  top: 0;
  z-index: 200;
  backdrop-filter: blur(12px);
}
header h1 {
  font-size: 14px;
  font-weight: 700;
  letter-spacing: .3px;
  color: var(--green);
  font-family: 'JetBrains Mono', monospace;
}
.status-badge {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 4px 12px;
  border-radius: 20px;
  border: 1px solid var(--border-hi);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .8px;
  color: var(--muted);
  font-family: 'JetBrains Mono', monospace;
  transition: all .3s;
}
.status-badge .dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--muted);
  flex-shrink: 0;
  transition: background .3s;
}
.status-badge.running {
  border-color: rgba(74,222,128,.4);
  color: var(--green);
  background: rgba(74,222,128,.05);
  animation: pulse-badge 2s ease-in-out infinite;
}
.status-badge.running .dot { background: var(--green); }
.status-badge.stopped { border-color: rgba(248,113,113,.4); color: var(--red); background: rgba(248,113,113,.05); }
.status-badge.stopped .dot { background: var(--red); }
@keyframes pulse-badge {
  0%,100% { box-shadow: 0 0 0 0 rgba(74,222,128,.3); }
  50%      { box-shadow: 0 0 0 6px rgba(74,222,128,0); }
}
.hdr-right {
  margin-left: auto;
  color: var(--muted);
  font-size: 12px;
  font-family: 'JetBrains Mono', monospace;
}

/* ── 탭 바 ────────────────────────────────────────────────────────────── */
nav {
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  padding: 0 28px;
  display: flex;
  gap: 0;
}
.tab-btn {
  position: relative;
  padding: 15px 22px;
  border: none;
  background: none;
  color: var(--muted);
  font-size: 13px;
  font-family: 'Inter', sans-serif;
  font-weight: 500;
  letter-spacing: .1px;
  transition: color .2s;
}
.tab-btn:hover { color: var(--text); }
.tab-btn::after {
  content: '';
  position: absolute;
  bottom: 0; left: 50%;
  width: 0; height: 2px;
  background: var(--green);
  transform: translateX(-50%);
  border-radius: 2px 2px 0 0;
  transition: width .25s ease;
}
.tab-btn.active { color: var(--green); font-weight: 600; }
.tab-btn.active::after { width: 60%; }

/* ── 패널 ─────────────────────────────────────────────────────────────── */
.panel { display: none; padding: 28px; max-width: 1140px; margin: 0 auto; }
.panel.active { display: block; }

/* ── 공용 카드 ────────────────────────────────────────────────────────── */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px 24px;
  margin-bottom: 16px;
  transition: border-color .2s;
}
.card:hover { border-color: var(--border-hi); }
.card-title {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1.2px;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 16px;
  font-family: 'JetBrains Mono', monospace;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* ── 버튼 ─────────────────────────────────────────────────────────────── */
.btn {
  padding: 8px 18px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 600;
  border: 1px solid transparent;
  transition: all .2s;
  font-family: 'Inter', sans-serif;
  letter-spacing: .1px;
}
.btn-teal {
  background: var(--green);
  color: #000;
  border-color: var(--green);
}
.btn-teal:hover { background: #22c55e; border-color: #22c55e; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(74,222,128,.25); }
.btn-red {
  background: var(--red);
  color: #fff;
  border-color: var(--red);
}
.btn-red:hover { background: #ef4444; border-color: #ef4444; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(248,113,113,.25); }
.btn-ghost {
  background: transparent;
  color: var(--text);
  border-color: var(--border-hi);
}
.btn-ghost:hover { border-color: var(--green); color: var(--green); background: rgba(74,222,128,.05); }
.btn:disabled { opacity: .35; cursor: not-allowed; transform: none !important; box-shadow: none !important; }
.btn-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

/* ── 종목 칩 ──────────────────────────────────────────────────────────── */
.chips { display: flex; gap: 8px; margin-bottom: 18px; }
.chip {
  padding: 6px 20px;
  border-radius: 20px;
  border: 1px solid var(--border-hi);
  background: transparent;
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: .8px;
  transition: all .2s;
}
.chip:hover { border-color: var(--green); color: var(--green); }
.chip.active {
  background: rgba(74,222,128,.1);
  border-color: var(--green);
  color: var(--green);
  box-shadow: 0 0 12px rgba(74,222,128,.15);
}

/* ── 스케줄 카드 ──────────────────────────────────────────────────────── */
.schedule-row {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}
.sched-item { display: flex; gap: 10px; align-items: center; font-size: 13px; }
.sched-label { color: var(--muted); font-size: 11px; font-family: 'JetBrains Mono', monospace; letter-spacing: .5px; }
.sched-val  { color: var(--yellow); font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 500; }

/* 토글 스위치 */
.toggle-wrap { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.toggle-label { font-size: 12px; color: var(--muted); font-weight: 500; }
.toggle {
  position: relative; width: 40px; height: 22px;
  -webkit-appearance: none; appearance: none;
  background: var(--border-hi); border-radius: 11px;
  cursor: pointer; transition: background .2s;
}
.toggle::after {
  content: ''; position: absolute;
  top: 3px; left: 3px;
  width: 16px; height: 16px;
  border-radius: 50%; background: #fff;
  transition: transform .2s;
  box-shadow: 0 1px 3px rgba(0,0,0,.3);
}
.toggle:checked { background: var(--green); }
.toggle:checked::after { transform: translateX(18px); }

/* ── 로그 패널 ────────────────────────────────────────────────────────── */
.log-panel {
  background: #070a0f;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  height: 320px;
  overflow-y: auto;
  font-family: 'JetBrains Mono', 'Courier New', monospace;
  font-size: 12px;
  line-height: 1.7;
  color: var(--green-log);
  white-space: pre-wrap;
  word-break: break-all;
}
.log-panel .log-err  { color: var(--red); }
.log-panel .log-warn { color: var(--yellow); }
.log-panel .log-info { color: var(--blue); }
.log-panel .log-dim  { color: var(--muted2); }

/* ── 결과 탭 ──────────────────────────────────────────────────────────── */
.res-controls {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
  margin-bottom: 18px;
}
.res-controls select { padding: 7px 12px; min-width: 160px; font-size: 13px; }

/* 차트 래퍼 — 1분봉 차트 영역은 그대로 유지 */
.chart-wrap { text-align: center; }
.chart-img  {
  max-width: 100%;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  box-shadow: 0 8px 32px rgba(0,0,0,.4);
}
.chart-ph {
  background: var(--bg-input);
  border: 2px dashed var(--border-hi);
  border-radius: var(--radius);
  padding: 60px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  font-size: 13px;
  font-family: 'JetBrains Mono', monospace;
}

/* ── 코드 에디터 ──────────────────────────────────────────────────────── */
.code-editor {
  width: 100%; height: 420px;
  padding: 14px 16px;
  background: #070a0f;
  color: #a8ff78;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-family: 'JetBrains Mono', 'Courier New', monospace;
  font-size: 12.5px;
  line-height: 1.7;
  resize: vertical;
  display: block;
  margin-bottom: 14px;
  transition: border-color .2s;
}
.code-editor:focus { border-color: var(--green); outline: none; box-shadow: 0 0 0 3px rgba(74,222,128,.08); }

/* ── 버전 목록 ────────────────────────────────────────────────────────── */
.ver-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.ver-item {
  display: flex; align-items: center; gap: 12px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 16px;
  transition: border-color .2s;
}
.ver-item:hover { border-color: var(--border-hi); }
.ver-name { font-weight: 600; font-size: 13px; flex: 1; }
.ver-meta {
  font-size: 11px;
  color: var(--muted);
  margin-top: 3px;
  font-family: 'JetBrains Mono', monospace;
}
.ver-badge {
  display: inline-block;
  font-size: 10px; padding: 2px 8px;
  border-radius: 10px;
  background: rgba(74,222,128,.1);
  color: var(--green);
  border: 1px solid rgba(74,222,128,.2);
  font-family: 'JetBrains Mono', monospace;
  font-weight: 600;
}

/* ── BT 결과 그리드 ──────────────────────────────────────────────────── */
.bt-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
  margin-top: 14px;
}
@media (max-width: 700px) { .bt-grid { grid-template-columns: 1fr; } }
.bt-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  transition: border-color .2s, transform .2s;
}
.bt-card:hover { border-color: var(--border-hi); transform: translateY(-2px); }
.bt-card-header {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
}
.bt-card-title { font-size: 13px; font-weight: 600; flex: 1; }
.bt-card-meta  {
  font-size: 11px;
  color: var(--muted);
  margin-top: 2px;
  font-family: 'JetBrains Mono', monospace;
}
.bt-card-body  { padding: 12px; }
.bt-card img   { width: 100%; display: block; border-radius: var(--radius-sm); }
.bt-filter-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.bt-filter-label {
  display: flex; align-items: center; gap: 6px;
  padding: 5px 12px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 12px;
  cursor: pointer;
  font-family: 'JetBrains Mono', monospace;
  transition: border-color .2s;
}
.bt-filter-label:hover { border-color: var(--border-hi); }

/* ── 모달 ─────────────────────────────────────────────────────────────── */
#modal {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.75);
  backdrop-filter: blur(4px);
  z-index: 500;
  align-items: center; justify-content: center;
}
#modal.open { display: flex; }
.modal-box {
  background: var(--bg-card);
  border: 1px solid var(--border-hi);
  border-radius: 12px;
  padding: 28px 32px;
  width: 420px; max-width: 95vw;
  box-shadow: 0 24px 64px rgba(0,0,0,.6);
}
.modal-box h3 {
  font-size: 15px;
  font-weight: 700;
  margin-bottom: 20px;
  color: var(--green);
}
.modal-field  { margin-bottom: 16px; }
.modal-field label {
  display: block;
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
  margin-bottom: 6px;
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: .6px;
  text-transform: uppercase;
}
.modal-field input, .modal-field textarea {
  width: 100%; padding: 9px 12px; font-size: 13px;
}
.modal-field textarea { height: 72px; resize: vertical; }
.modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

/* ── 토스트 ───────────────────────────────────────────────────────────── */
#toast {
  display: none; position: fixed;
  bottom: 28px; right: 28px; z-index: 600;
  background: var(--bg-card);
  border: 1px solid var(--border-hi);
  border-radius: var(--radius);
  padding: 10px 20px;
  font-size: 13px;
  font-family: 'JetBrains Mono', monospace;
  box-shadow: 0 8px 32px rgba(0,0,0,.5);
  max-width: 340px;
}

/* ── 스피너 ───────────────────────────────────────────────────────────── */
.spinner {
  display: inline-block;
  width: 14px; height: 14px;
  border: 2px solid rgba(74,222,128,.2);
  border-top-color: var(--green);
  border-radius: 50%;
  animation: spin .7s linear infinite;
  vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── 구분선 ───────────────────────────────────────────────────────────── */
.divider {
  height: 1px;
  background: var(--border);
  margin: 16px 0;
}
</style>
</head>
<body>

<!-- ── 헤더 ─────────────────────────────────────────────────────────────── -->
<header>
  <h1>⚡ Trading Dashboard</h1>
  <div class="status-badge" id="hdr-badge">
    <span class="dot"></span>
    <span id="hdr-status-txt">IDLE</span>
  </div>
  <div class="hdr-right" id="hdr-clock"></div>
</header>

<!-- ── 탭 바 ─────────────────────────────────────────────────────────────── -->
<nav>
  <button class="tab-btn active" data-panel="trading">매매</button>
  <button class="tab-btn"        data-panel="results">결과</button>
  <button class="tab-btn"        data-panel="backtest">백테스트</button>
  <button class="tab-btn"        data-panel="btresults">백테스트 결과</button>
</nav>

<!-- ════════════════════════════════════════════════════════════════════════
     탭 1: 매매
     ════════════════════════════════════════════════════════════════════════ -->
<div class="panel active" id="panel-trading">

  <!-- 스케줄 카드 -->
  <div class="card">
    <div class="card-title">자동 스케줄</div>
    <div class="schedule-row">
      <div class="sched-item">
        <span class="sched-label">▶ 자동 시작</span>
        <span class="sched-val" id="sched-next-start">-</span>
      </div>
      <div class="sched-item" style="margin-left:16px;">
        <span class="sched-label">■ 자동 종료</span>
        <span class="sched-val" id="sched-next-stop">-</span>
      </div>
      <div class="toggle-wrap">
        <span class="toggle-label" id="sched-toggle-label">스케줄 ON</span>
        <input type="checkbox" class="toggle" id="sched-toggle" checked>
      </div>
    </div>
  </div>

  <!-- 종목 선택 + 버튼 -->
  <div class="card">
    <div class="card-title">종목 선택</div>
    <div class="chips">
      <button class="chip" data-sym="SPY">SPY</button>
      <button class="chip" data-sym="QQQ">QQQ</button>
      <button class="chip active" data-sym="BOTH">BOTH</button>
    </div>
    <div class="btn-row">
      <button class="btn btn-teal" id="btn-start">▶ 매매 시작</button>
      <button class="btn btn-red"  id="btn-stop">■ 매매 종료</button>
    </div>
  </div>

  <!-- 로그 -->
  <div class="card">
    <div class="card-title">실시간 로그
      <button class="btn btn-ghost" id="btn-clear-log"
        style="margin-left:auto;font-size:11px;padding:3px 10px;">지우기</button>
    </div>
    <div class="log-panel" id="trade-log"></div>
  </div>
</div>

<!-- ════════════════════════════════════════════════════════════════════════
     탭 2: 결과
     ════════════════════════════════════════════════════════════════════════ -->
<div class="panel" id="panel-results">
  <div class="card">
    <div class="card-title">거래 결과</div>
    <div class="res-controls">
      <select id="res-date-sel"></select>
      <button class="btn btn-ghost" id="btn-res-load" style="font-size:12px;padding:6px 14px;">조회</button>
      <button class="btn btn-ghost" id="btn-csv-dl"
        style="font-size:12px;padding:6px 14px;" disabled>CSV 다운로드</button>
    </div>
    <div id="res-chart-wrap">
      <div class="chart-ph" id="res-chart-ph">날짜를 선택하세요</div>
      <img class="chart-img" id="res-chart-img" style="display:none;" alt="결과 차트">
    </div>
  </div>
</div>

<!-- ════════════════════════════════════════════════════════════════════════
     탭 3: 백테스트
     ════════════════════════════════════════════════════════════════════════ -->
<div class="panel" id="panel-backtest">

  <!-- 버전 관리 -->
  <div class="card">
    <div class="card-title">버전 관리</div>
    <div class="btn-row" style="margin-bottom:12px;">
      <select id="ver-sel" style="padding:7px 12px; flex:1; min-width:200px;">
        <option value="">-- 저장된 버전 선택 --</option>
      </select>
      <button class="btn btn-ghost" id="btn-load-ver" style="font-size:12px;padding:6px 14px;">불러오기</button>
      <button class="btn btn-ghost" id="btn-del-ver"
        style="font-size:12px;padding:6px 14px;color:var(--red);border-color:rgba(248,113,113,.3);">삭제</button>
    </div>
    <div class="ver-list" id="ver-list"></div>
  </div>

  <!-- 코드 에디터 -->
  <div class="card">
    <div class="card-title">코드 에디터</div>
    <textarea class="code-editor" id="code-editor" spellcheck="false"
      placeholder="# 백테스트 코드를 작성하거나 버전을 불러오세요"></textarea>
    <div class="btn-row">
      <button class="btn btn-teal"  id="btn-run-bt">▶ 실행</button>
      <button class="btn btn-ghost" id="btn-save-ver" style="font-size:12px;">버전으로 저장</button>
      <span id="bt-spinner" style="display:none;color:var(--muted);font-size:13px;"><span class="spinner"></span> 실행 중…</span>
    </div>
  </div>

  <!-- 백테스트 로그 -->
  <div class="card">
    <div class="card-title">실행 로그
      <button class="btn btn-ghost" id="btn-clear-bt-log"
        style="margin-left:auto;font-size:11px;padding:3px 10px;">지우기</button>
    </div>
    <div class="log-panel" id="bt-log"></div>
  </div>
</div>

<!-- ════════════════════════════════════════════════════════════════════════
     탭 4: 백테스트 결과
     ════════════════════════════════════════════════════════════════════════ -->
<div class="panel" id="panel-btresults">
  <div class="card">
    <div class="card-title">백테스트 결과
      <button class="btn btn-ghost" id="btn-reload-bt-res"
        style="margin-left:auto;font-size:11px;padding:3px 10px;">새로고침</button>
    </div>
    <div class="bt-filter-bar" id="bt-filter-bar"></div>
    <div id="bt-no-results" style="display:none;color:var(--muted);text-align:center;padding:48px;font-size:13px;">
      결과 이미지가 없습니다
    </div>
    <div class="bt-grid" id="bt-grid"></div>
  </div>
</div>

<!-- ── 버전 저장 모달 ─────────────────────────────────────────────────────── -->
<div id="modal">
  <div class="modal-box">
    <h3>버전 저장</h3>
    <div class="modal-field">
      <label>버전 이름 *</label>
      <input type="text" id="modal-name" placeholder="예: v3 stop_loss 1.2%">
    </div>
    <div class="modal-field">
      <label>설명 (선택)</label>
      <textarea id="modal-desc" placeholder="변경 내용 메모…"></textarea>
    </div>
    <div class="modal-btns">
      <button class="btn btn-ghost" onclick="closeModal()">취소</button>
      <button class="btn btn-teal"  onclick="confirmSave()">저장</button>
    </div>
  </div>
</div>

<!-- ── 토스트 ─────────────────────────────────────────────────────────────── -->
<div id="toast"></div>

<!-- ════════════════════════════════════════════════════════════════════════
     JavaScript
     ════════════════════════════════════════════════════════════════════════ -->
<script>
// ── 전역 ─────────────────────────────────────────────────────────────────
let selSym     = "BOTH";
let tradeSSE   = null;
let btSSE      = null;
let btVersions = [];
let btFiles    = [];
let _saveCode  = "";   // 모달 임시 저장

// ── 유틸 ─────────────────────────────────────────────────────────────────
function toast(msg, type = "info") {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.style.borderColor =
    type === "err" ? "rgba(248,113,113,.5)" :
    type === "ok"  ? "rgba(74,222,128,.5)" :
    type === "warn"? "rgba(251,191,36,.5)" : "var(--border-hi)";
  el.style.display = "block";
  clearTimeout(el._t);
  el._t = setTimeout(() => el.style.display = "none", 3500);
}

async function api(path, opts = {}) {
  const res = await fetch(path, {
    headers: { "Content-Type": "application/json" },
    ...opts,
  });
  if (!res.ok) {
    const d = await res.json().catch(() => ({}));
    throw new Error(d.detail || d.error || res.statusText);
  }
  return res.json();
}

function fmtDate(ts) { return ts ? String(ts).slice(0, 10) : "-"; }
function fmtDatetime(ts) { return ts ? String(ts).slice(0, 16).replace("T", " ") : "-"; }

// YYYYMMDD → "2026-05-27"
function fmtYMD(s) {
  if (!s || s.length < 8) return s;
  return s.slice(0,4) + "-" + s.slice(4,6) + "-" + s.slice(6,8);
}

// 로그 줄 추가 (색상 분류)
function appendLog(panelId, text) {
  const el = document.getElementById(panelId);
  const div = document.createElement("div");
  const t = text.toLowerCase();
  if (t.includes("error") || t.includes("오류") || t.includes("[err")) {
    div.className = "log-err";
  } else if (t.includes("warn") || t.includes("경고")) {
    div.className = "log-warn";
  } else if (t.includes("info") || t.includes("[info") || t.startsWith("  선택")) {
    div.className = "log-info";
  } else if (t.startsWith(":") || t === "") {
    div.className = "log-dim";
  }
  div.textContent = text;
  el.appendChild(div);
  // 최대 2000줄 유지
  while (el.children.length > 2000) el.removeChild(el.firstChild);
  el.scrollTop = el.scrollHeight;
}

// ── 시계 ─────────────────────────────────────────────────────────────────
setInterval(() => {
  document.getElementById("hdr-clock").textContent =
    new Date().toLocaleTimeString("ko-KR");
}, 1000);

// ── 헤더 상태 배지 ────────────────────────────────────────────────────────
function setStatusBadge(status) {
  const badge = document.getElementById("hdr-badge");
  const txt   = document.getElementById("hdr-status-txt");
  badge.className = "status-badge";
  if (status === "RUNNING") badge.classList.add("running");
  else if (status === "STOPPED") badge.classList.add("stopped");
  txt.textContent = status;
}

// 상태 폴링 (3초)
async function pollStatus() {
  try {
    const d = await api("/api/trading/status");
    setStatusBadge(d.status);
    if (d.schedule) {
      document.getElementById("sched-next-start").textContent = d.schedule.next_start || "-";
      document.getElementById("sched-next-stop").textContent  = d.schedule.next_stop  || "-";
      const tog = document.getElementById("sched-toggle");
      if (tog.checked !== d.schedule.enabled) tog.checked = d.schedule.enabled;
      document.getElementById("sched-toggle-label").textContent =
        d.schedule.enabled ? "스케줄 ON" : "스케줄 OFF";
    }
  } catch(_) {}
  setTimeout(pollStatus, 3000);
}
pollStatus();

// ── 탭 전환 ──────────────────────────────────────────────────────────────
document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("panel-" + btn.dataset.panel).classList.add("active");
    if (btn.dataset.panel === "results")   initResultsTab();
    if (btn.dataset.panel === "backtest")  initBacktestTab();
    if (btn.dataset.panel === "btresults") loadBtResults();
  });
});

// ── 종목 칩 ──────────────────────────────────────────────────────────────
document.querySelectorAll(".chip").forEach(c => {
  c.addEventListener("click", () => {
    document.querySelectorAll(".chip").forEach(x => x.classList.remove("active"));
    c.classList.add("active");
    selSym = c.dataset.sym;
  });
});

// ════════════════════════════════════════════════════════════════════════
// 탭 1: 매매
// ════════════════════════════════════════════════════════════════════════

// 스케줄 토글
document.getElementById("sched-toggle").addEventListener("change", async (e) => {
  const enabled = e.target.checked;
  document.getElementById("sched-toggle-label").textContent = enabled ? "스케줄 ON" : "스케줄 OFF";
  try {
    await api("/api/trading/schedule/toggle", {
      method: "POST",
      body: JSON.stringify({ enabled }),
    });
    toast(enabled ? "스케줄 활성화됨" : "스케줄 비활성화됨", "ok");
  } catch(err) { toast(err.message, "err"); }
});

// 매매 시작
document.getElementById("btn-start").addEventListener("click", async () => {
  if (!selSym) return toast("종목을 선택하세요", "warn");
  try {
    await api("/api/trading/start", {
      method: "POST",
      body: JSON.stringify({ ticker: selSym }),
    });
    setStatusBadge("RUNNING");
    toast(`${selSym} 매매 시작`, "ok");
    connectTradeSSE();
  } catch(err) { toast(err.message, "err"); }
});

// 매매 종료
document.getElementById("btn-stop").addEventListener("click", async () => {
  try {
    await api("/api/trading/stop", { method: "POST" });
    setStatusBadge("STOPPED");
    toast("매매 종료 요청", "warn");
    // 결과 탭 자동 전환
    setTimeout(() => {
      document.querySelector("[data-panel='results']").click();
    }, 1500);
  } catch(err) { toast(err.message, "err"); }
});

// 로그 지우기
document.getElementById("btn-clear-log").addEventListener("click", () => {
  document.getElementById("trade-log").innerHTML = "";
});

// SSE 연결
function connectTradeSSE() {
  if (tradeSSE) { tradeSSE.close(); tradeSSE = null; }
  tradeSSE = new EventSource("/api/trading/logs/stream");
  tradeSSE.onmessage = (e) => {
    if (e.data === "[STREAM END]") {
      tradeSSE.close(); tradeSSE = null;
      setStatusBadge("STOPPED");
      return;
    }
    appendLog("trade-log", e.data);
  };
  tradeSSE.onerror = () => {
    if (tradeSSE) { tradeSSE.close(); tradeSSE = null; }
  };
}

// ════════════════════════════════════════════════════════════════════════
// 탭 2: 결과
// ════════════════════════════════════════════════════════════════════════

async function initResultsTab() {
  try {
    const d   = await api("/api/results");
    const sel = document.getElementById("res-date-sel");
    sel.innerHTML = "";
    const dates = d.dates || [];
    if (!dates.length) {
      sel.innerHTML = "<option>결과 없음</option>";
      return;
    }
    dates.forEach(yyyymmdd => {
      const opt = document.createElement("option");
      opt.value = yyyymmdd;
      opt.textContent = fmtYMD(yyyymmdd);
      sel.appendChild(opt);
    });
    loadResultImage(dates[0]);
  } catch(err) { toast(err.message, "err"); }
}

function loadResultImage(yyyymmdd) {
  if (!yyyymmdd) return;
  const img = document.getElementById("res-chart-img");
  const ph  = document.getElementById("res-chart-ph");
  img.style.display = "none";
  ph.style.display  = "flex";
  ph.textContent    = "로딩 중…";
  img.src = `/api/results/${yyyymmdd}/image?t=${Date.now()}`;
  img.onload  = () => { ph.style.display = "none"; img.style.display = "block"; };
  img.onerror = () => { ph.textContent = "차트 없음"; };
  document.getElementById("btn-csv-dl").disabled = false;
  document.getElementById("btn-csv-dl").dataset.date = yyyymmdd;
}

document.getElementById("btn-res-load").addEventListener("click", () => {
  const sel = document.getElementById("res-date-sel");
  if (sel.value) loadResultImage(sel.value);
});

document.getElementById("res-date-sel").addEventListener("change", (e) => {
  loadResultImage(e.target.value);
});

document.getElementById("btn-csv-dl").addEventListener("click", () => {
  const date = document.getElementById("btn-csv-dl").dataset.date;
  if (date) window.location.href = `/api/results/${date}/csv`;
});

// ════════════════════════════════════════════════════════════════════════
// 탭 3: 백테스트
// ════════════════════════════════════════════════════════════════════════

async function initBacktestTab() {
  try {
    const d = await api("/api/backtest/versions");
    btVersions = d.versions || [];
    renderVerSel();
    renderVerList();
  } catch(err) { toast(err.message, "err"); }
}

function renderVerSel() {
  const sel = document.getElementById("ver-sel");
  const cur = sel.value;
  sel.innerHTML = '<option value="">-- 저장된 버전 선택 --</option>';
  btVersions.forEach(v => {
    const opt = document.createElement("option");
    opt.value = v.id; opt.textContent = v.name;
    sel.appendChild(opt);
  });
  if (cur) sel.value = cur;
}

function renderVerList() {
  const el = document.getElementById("ver-list");
  if (!btVersions.length) {
    el.innerHTML = '<div style="color:var(--muted);font-size:13px;padding:8px 0;">저장된 버전 없음</div>';
    return;
  }
  el.innerHTML = btVersions.map(v => `
    <div class="ver-item">
      <div style="flex:1;">
        <div class="ver-name">${escHtml(v.name)}</div>
        <div class="ver-meta">${escHtml(v.description || "설명 없음")} · ${fmtDatetime(v.created_at)}</div>
      </div>
      <button class="btn btn-ghost" style="font-size:11px;padding:4px 9px;"
        onclick="loadVerCode('${v.id}')">불러오기</button>
    </div>`).join("");
}

function escHtml(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

// 버전 불러오기 버튼
document.getElementById("btn-load-ver").addEventListener("click", async () => {
  const vid = document.getElementById("ver-sel").value;
  if (!vid) return toast("버전을 선택하세요", "warn");
  await loadVerCode(vid);
});

async function loadVerCode(vid) {
  try {
    const d = await api(`/api/backtest/versions/${vid}`);
    document.getElementById("code-editor").value = d.code || "";
    toast("코드 로드 완료", "ok");
  } catch(err) { toast(err.message, "err"); }
}

// 버전 삭제
document.getElementById("btn-del-ver").addEventListener("click", async () => {
  const sel = document.getElementById("ver-sel");
  const vid = sel.value;
  if (!vid) return toast("삭제할 버전을 선택하세요", "warn");
  if (!confirm(`"${sel.options[sel.selectedIndex].text}" 버전을 삭제하시겠습니까?`)) return;
  try {
    await api(`/api/backtest/versions/${vid}`, { method: "DELETE" });
    toast("삭제 완료", "ok");
    initBacktestTab();
  } catch(err) { toast(err.message, "err"); }
});

// Tab 키 들여쓰기
document.getElementById("code-editor").addEventListener("keydown", (e) => {
  if (e.key === "Tab") {
    e.preventDefault();
    const el = e.target;
    const s  = el.selectionStart;
    el.value = el.value.slice(0, s) + "    " + el.value.slice(el.selectionEnd);
    el.selectionStart = el.selectionEnd = s + 4;
  }
});

// 버전으로 저장 (모달)
document.getElementById("btn-save-ver").addEventListener("click", () => {
  const code = document.getElementById("code-editor").value.trim();
  if (!code) return toast("저장할 코드가 없습니다", "warn");
  _saveCode = code;
  document.getElementById("modal-name").value = "";
  document.getElementById("modal-desc").value = "";
  document.getElementById("modal").classList.add("open");
  setTimeout(() => document.getElementById("modal-name").focus(), 50);
});

document.getElementById("modal-name").addEventListener("keydown", (e) => {
  if (e.key === "Enter") confirmSave();
});

// 모달 바깥 클릭 닫기
document.getElementById("modal").addEventListener("click", (e) => {
  if (e.target === document.getElementById("modal")) closeModal();
});

function closeModal() {
  document.getElementById("modal").classList.remove("open");
  _saveCode = "";
}

async function confirmSave() {
  const name = document.getElementById("modal-name").value.trim();
  const desc = document.getElementById("modal-desc").value.trim();
  if (!name) return toast("버전 이름을 입력하세요", "warn");
  try {
    await api("/api/backtest/versions", {
      method: "POST",
      body: JSON.stringify({ name, description: desc, code: _saveCode }),
    });
    closeModal();
    toast(`"${name}" 저장 완료`, "ok");
    initBacktestTab();
  } catch(err) { toast(err.message, "err"); }
}

// 백테스트 실행
document.getElementById("btn-run-bt").addEventListener("click", async () => {
  const code = document.getElementById("code-editor").value.trim();
  if (!code) return toast("코드를 입력하세요", "warn");

  document.getElementById("bt-log").innerHTML = "";
  document.getElementById("btn-run-bt").disabled = true;
  document.getElementById("bt-spinner").style.display = "inline";

  try {
    await api("/api/backtest/run", {
      method: "POST",
      body: JSON.stringify({ code }),
    });
  } catch(err) {
    toast(err.message, "err");
    document.getElementById("btn-run-bt").disabled = false;
    document.getElementById("bt-spinner").style.display = "none";
    return;
  }

  // SSE 연결
  if (btSSE) { btSSE.close(); btSSE = null; }
  btSSE = new EventSource("/api/backtest/logs/stream");
  btSSE.onmessage = (e) => {
    if (e.data === "[STREAM END]") {
      btSSE.close(); btSSE = null;
      document.getElementById("btn-run-bt").disabled = false;
      document.getElementById("bt-spinner").style.display = "none";
      toast("백테스트 완료! 결과 탭에서 확인하세요.", "ok");
      setTimeout(() => {
        document.querySelector("[data-panel='btresults']").click();
      }, 900);
      return;
    }
    appendLog("bt-log", e.data);
  };
  btSSE.onerror = () => {
    document.getElementById("btn-run-bt").disabled = false;
    document.getElementById("bt-spinner").style.display = "none";
    if (btSSE) { btSSE.close(); btSSE = null; }
  };
});

document.getElementById("btn-clear-bt-log").addEventListener("click", () => {
  document.getElementById("bt-log").innerHTML = "";
});

// ════════════════════════════════════════════════════════════════════════
// 탭 4: 백테스트 결과
// ════════════════════════════════════════════════════════════════════════

async function loadBtResults() {
  try {
    const d = await api("/api/backtest/results");
    btFiles = d.files || [];
  } catch(_) { btFiles = []; }
  renderBtFilterBar();
  renderBtGrid(btFiles.map((_, i) => i));
}

function renderBtFilterBar() {
  const bar = document.getElementById("bt-filter-bar");
  if (!btFiles.length) { bar.innerHTML = ""; return; }
  bar.innerHTML = btFiles.map((f, i) => `
    <label class="bt-filter-label">
      <input type="checkbox" checked data-idx="${i}"
             onchange="filterBtGrid()" style="accent-color:var(--green);">
      ${escHtml(f.filename)}
    </label>`).join("");
}

function filterBtGrid() {
  const checked = [...document.querySelectorAll("#bt-filter-bar input[type=checkbox]")]
    .map((cb, i) => cb.checked ? i : -1)
    .filter(i => i >= 0);
  renderBtGrid(checked);
}

function renderBtGrid(indices) {
  const noEl = document.getElementById("bt-no-results");
  const grid = document.getElementById("bt-grid");
  if (!btFiles.length || !indices.length) {
    noEl.style.display = "block";
    grid.innerHTML = "";
    return;
  }
  noEl.style.display = "none";
  grid.innerHTML = indices.map(i => {
    const f = btFiles[i];
    const mtime = f.mtime ? new Date(f.mtime * 1000).toLocaleString("ko-KR") : "-";
    return `
    <div class="bt-card">
      <div class="bt-card-header">
        <div style="flex:1;">
          <div class="bt-card-title">${escHtml(f.filename)}</div>
          <div class="bt-card-meta">${mtime}</div>
        </div>
        <a href="/api/backtest/results/${encodeURIComponent(f.filename)}"
           target="_blank" class="btn btn-ghost"
           style="font-size:11px;padding:4px 9px;text-decoration:none;">열기</a>
      </div>
      <div class="bt-card-body">
        <img src="/api/backtest/results/${encodeURIComponent(f.filename)}?t=${Date.now()}"
             alt="${escHtml(f.filename)}"
             onerror="this.style.display='none';this.insertAdjacentHTML('afterend','<div style=color:var(--muted);padding:20px;text-align:center>이미지 없음</div>')">
      </div>
    </div>`;
  }).join("");
}

document.getElementById("btn-reload-bt-res").addEventListener("click", loadBtResults);

// ── 초기화 ───────────────────────────────────────────────────────────────
document.addEventListener("DOMContentLoaded", () => {
  initResultsTab();
});
</script>
</body>
</html>
